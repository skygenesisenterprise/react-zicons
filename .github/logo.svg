<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="React-Zicons — typed React icons for Sky Genesis Enterprise">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#151b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="66" x2="240" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="36" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="35" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(72 60)">
    <rect width="180" height="180" rx="40" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="24" y="24" width="36" height="36" rx="10" fill="url(#accent)" opacity="0.45"/>
    <rect x="72" y="24" width="36" height="36" rx="10" fill="url(#accent)" opacity="0.72"/>
    <rect x="120" y="24" width="36" height="36" rx="10" fill="url(#accent)"/>
    <rect x="24" y="72" width="36" height="36" rx="10" fill="url(#accent)" opacity="0.72"/>
    <rect x="72" y="72" width="36" height="36" rx="10" fill="url(#accent)"/>
    <rect x="120" y="72" width="36" height="36" rx="10" fill="url(#accent)" opacity="0.72"/>
    <rect x="24" y="120" width="36" height="36" rx="10" fill="url(#accent)"/>
    <rect x="72" y="120" width="36" height="36" rx="10" fill="url(#accent)" opacity="0.72"/>
    <rect x="120" y="120" width="36" height="36" rx="10" fill="url(#accent)" opacity="0.45"/>
  </g>

  <text x="300" y="142" fill="url(#fade)" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="-2">React-Zicons</text>
  <text x="304" y="192" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="500">Typed, tree-shakeable React icons for Sky Genesis Enterprise</text>
  <text x="304" y="234" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">@skygenesisenterprise/react-zicons</text>
</svg>
